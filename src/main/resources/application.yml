server:
  port: 8080

spring:
  application:
    name: fund-copilot
  config:
    import: optional:file:./config/application-private.yml
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:fundcopilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:fund-copilot-disabled-key}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

fund-copilot:
  market-data:
    eastmoney:
      timeout-seconds: 6
      nav-page-size: 20
      nav-history-size: 320
      request-interval-ms: 300
      demo-fallback-enabled: ${FUND_MARKET_DEMO_FALLBACK_ENABLED:true}
  observation:
    universe-size: ${FUND_OBSERVATION_UNIVERSE_SIZE:100}
    universe-candidate-size: ${FUND_OBSERVATION_CANDIDATE_SIZE:300}
    ranking-size: ${FUND_OBSERVATION_RANKING_SIZE:10}
    entry-streak-days: ${FUND_OBSERVATION_ENTRY_DAYS:3}
    exit-streak-days: ${FUND_OBSERVATION_EXIT_DAYS:3}
    sync-history-size: ${FUND_OBSERVATION_HISTORY_SIZE:320}
    sync-interval-ms: ${FUND_OBSERVATION_SYNC_INTERVAL_MS:300}
    schedule:
      primary-sync: ${FUND_OBSERVATION_PRIMARY_SYNC:0 0 20 * * *}
      retry-sync: ${FUND_OBSERVATION_RETRY_SYNC:0 30 22 * * *}
      compensation-sync: ${FUND_OBSERVATION_COMPENSATION_SYNC:0 0 8 * * *}
      ranking: ${FUND_OBSERVATION_RANKING_CRON:0 30 8 * * *}
  agent:
    base-url: ${FUND_OPENAI_BASE_URL:}
    api-key: ${FUND_OPENAI_API_KEY:}
    model-name: ${FUND_OPENAI_MODEL:gpt-5.6-terra}
    enable-llm: ${FUND_AGENT_ENABLE_LLM:false}
    stage-max-iterations: ${FUND_AGENT_STAGE_MAX_ITERATIONS:3}
    final-max-iterations: ${FUND_AGENT_FINAL_MAX_ITERATIONS:6}
    request-timeout-seconds: ${FUND_AGENT_REQUEST_TIMEOUT_SECONDS:60}
    task-timeout-seconds: ${FUND_AGENT_TASK_TIMEOUT_SECONDS:300}
  cache:
    redis-enabled: ${FUND_CACHE_REDIS_ENABLED:true}
